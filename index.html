<script>
/* ============ SAFE STORAGE UTILITY ============ */
function safeGet(k, d = null) { try { return localStorage.getItem(k) ?? d; } catch(e) { return d; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

/* ============ SETTINGS & DATA ============ */
const TMDB_KEY = "91ed6b7b163052c7f5fc71d5e198a4ef";
const API = "https://api.themoviedb.org/3", IMG = "https://image.tmdb.org/t/p/";
const HAS_KEY = TMDB_KEY && TMDB_KEY !== "YOUR_TMDB_API_KEY";

const items = [
  {id:94605, k:"tv",    c:"anime", t:"Arcane"},
  {id:550,   k:"movie", c:"movie", t:"Fight Club"},
  {id:93405, k:"tv",    c:"drama", t:"Squid Game"},
  {id:1429,  k:"tv",    c:"anime", t:"Attack on Titan"},
  {id:157336,k:"movie", c:"movie", t:"Interstellar"},
  {id:94796, k:"tv",    c:"drama", t:"Crash Landing on You"},
  {id:85937, k:"tv",    c:"anime", t:"Demon Slayer"},
  {id:27205, k:"movie", c:"movie", t:"Inception"},
  {id:67915, k:"tv",    c:"drama", t:"Goblin"},
  {id:95479, k:"tv",    c:"anime", t:"Jujutsu Kaisen"},
  {id:496243,k:"movie", c:"movie", t:"Parasite"},
  {id:66732, k:"tv",    c:"drama", t:"Stranger Things"},
  {id:13916, k:"tv",    c:"anime", t:"Death Note"},
  {id:155,   k:"movie", c:"movie", t:"The Dark Knight"},
  {id:129,   k:"movie", c:"anime", t:"Spirited Away"},
  {id:1396,  k:"tv",    c:"drama", t:"Breaking Bad"}
];

const TABS = [
  ["all", "All", "fa-solid fa-border-all"],
  ["movie", "Movies", "fa-solid fa-film"],
  ["drama", "Dramas", "fa-solid fa-tv"],
  ["anime", "Anime", "fa-solid fa-wand-magic-sparkles"],
  ["trending", "Trending", "fa-solid fa-fire"],
  ["favs", "Favorites", "fa-solid fa-heart"],
  ["about", "About", "fa-solid fa-user"]
];

const LABEL = {movie:"Movie", drama:"Drama", anime:"Anime"};

const PROFILE = {
  photo: "my-pic.jpg",
  name: "MD. Emon Hasan",
  title: "Web Developer & Creator of MovieBox Hub",
  bio: "A passionate web developer learning and building modern, mobile-first web platforms and dynamic media portals.",
  links: [
    {icon: "fa-brands fa-facebook-f", label: "Facebook", url: "https://facebook.com/"},
    {icon: "fa-brands fa-github",      label: "GitHub",   url: "https://github.com/"},
    {icon: "fa-solid fa-envelope",     label: "Email",    url: "mailto:you@example.com"}
  ]
};

/* ============ STATE & HELPERS ============ */
let tab = "all", query = "", cur = null, season = 1, episodes = [], epIdx = 0, currentServer = 3;
const info = {};
let hot = [];
let remote = [], searching = false, timer;

const $ = s => document.querySelector(s);
const item = id => items.find(i => String(i.id) === String(id));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let favs = [];
try { favs = JSON.parse(safeGet("mbh_favs_tmdb", "[]")) || []; } catch (e) { favs = []; }
const saveFavs = () => {
  safeSet("mbh_favs_tmdb", JSON.stringify(favs));
  safeSet("mbh_extra", JSON.stringify(items.filter(i => i.extra && favs.some(f => String(f) === String(i.id)))));
};

try { (JSON.parse(safeGet("mbh_extra", "[]")) || []).forEach(x => { if (x && !item(x.id)) items.push(x); }); } catch (e) {}

/* ============ DYNAMIC SEO & SCHEMA GENERATOR ============ */
function injectMovieSchema(d) {
  let schemaScript = document.getElementById("movie-schema");
  if (!schemaScript) {
    schemaScript = document.createElement('script');
    schemaScript.id = "movie-schema";
    schemaScript.type = "application/ld+json";
    document.head.appendChild(schemaScript);
  }
  const schemaData = {
    "@context": "https://schema.org",
    "@type": "Movie",
    "name": d.title,
    "image": d.posterUrl || (d.poster ? IMG + "w500" + d.poster : ""),
    "description": d.overview,
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": d.rating && d.rating !== "–" ? d.rating : "8.0",
      "bestRating": "10"
    }
  };
  schemaScript.textContent = JSON.stringify(schemaData);
}

function updateSEO(title, overview, image) {
  document.title = title ? `${title} - Watch Free on AniCine Box` : "AniCine Box - Watch Anime, Movies & Dramas Free in HD";

  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) {
    metaDesc.setAttribute("content", overview ? overview.slice(0, 160) : "Stream your favorite Anime, Movies, and Asian Dramas in HD quality for free on AniCine Box.");
  }

  const imgUrl = image || "https://image.tmdb.org/t/p/w1280/1Xko2X4qfQ1y.jpg";
  const ogTitle = document.querySelector('meta[property="og:title"]');
  const twTitle = document.querySelector('meta[name="twitter:title"]');
  const ogImg = document.querySelector('meta[property="og:image"]');
  const twImg = document.querySelector('meta[name="twitter:image"]');

  if (ogTitle && title) ogTitle.setAttribute("content", `${title} - AniCine Box`);
  if (twTitle && title) twTitle.setAttribute("content", `${title} - AniCine Box`);
  if (ogImg) ogImg.setAttribute("content", imgUrl);
  if (twImg) twImg.setAttribute("content", imgUrl);
}

/* ============ THEME TOGGLE ============ */
function applyTheme(theme) {
  const icon = $("#themeIcon");
  if (theme === "light") {
    document.body.classList.add("light-theme");
    if (icon) icon.className = "fa-solid fa-sun text-amber-400";
  } else {
    document.body.classList.remove("light-theme");
    if (icon) icon.className = "fa-solid fa-moon text-emerald-500";
  }
}

function initTheme() {
  const savedTheme = safeGet("mbh_theme", "dark");
  applyTheme(savedTheme);
  const btn = $("#themeToggle");
  if (btn) {
    btn.onclick = () => {
      const isLight = document.body.classList.contains("light-theme");
      const nextTheme = isLight ? "dark" : "light";
      safeSet("mbh_theme", nextTheme);
      applyTheme(nextTheme);
    };
  }
}

/* ============ STREAM GENERATOR ============ */
function getStreamUrl(curItem, sN, epN, server) {
  if (!curItem) return "";
  const isTv = curItem.k === "tv";
  const d = info[curItem.id] || {};
  const streamId = d.imdbId || curItem.id;
  const isImdb = String(streamId).startsWith("tt");

  switch (server) {
    case 1:
      return isTv 
        ? `https://vidsrc.me/embed/tv?${isImdb ? 'imdb' : 'tmdb'}=${streamId}&season=${sN}&episode=${epN}` 
        : `https://vidsrc.me/embed/movie?${isImdb ? 'imdb' : 'tmdb'}=${streamId}`;
    case 2:
      return isTv 
        ? `https://player.autoembed.cc/embed/tv/${streamId}/${sN}/${epN}` 
        : `https://player.autoembed.cc/embed/movie/${streamId}`;
    case 3:
      return isTv 
        ? `https://vidlink.pro/tv/${streamId}/${sN}/${epN}` 
        : `https://vidlink.pro/movie/${streamId}`;
    case 4:
      return isTv 
        ? `https://www.2embed.cc/embedtv/${streamId}&s=${sN}&e=${epN}` 
        : `https://www.2embed.cc/embed/${streamId}`;
    case 5:
      return isTv 
        ? `https://player.smashy.stream/tv/${streamId}?s=${sN}&e=${epN}` 
        : `https://player.smashy.stream/movie/${streamId}`;
    default:
      return isTv 
        ? `https://vidlink.pro/tv/${streamId}/${sN}/${epN}` 
        : `https://vidlink.pro/movie/${streamId}`;
  }
}

/* ============ DATA FETCHING ============ */
const api = (path, extra = "") =>
  fetch(`${API}${path}?api_key=${TMDB_KEY}&language=en-US${extra}`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

function get(it) {
  if (!it) return { title: "Unknown", year: "", rating: "–", overview: "", poster: null, posterUrl: null, backdrop: null, genres: [], runtime: null, seasons: [] };
  const d = info[it.id] || {};
  return {
    title: d.title || it.t || "Untitled",
    year: d.year || "",
    rating: d.rating || "–",
    overview: d.overview || (HAS_KEY ? "Loading details…" : "Add your TMDB API key to load synopsis."),
    poster: d.poster || null,
    posterUrl: d.posterUrl || null,
    backdrop: d.backdrop || null,
    genres: Array.isArray(d.genres) ? d.genres : [],
    runtime: d.runtime || null,
    seasons: Array.isArray(d.seasons) ? d.seasons : []
  };
}

async function loadItem(it) {
  if (!it || (typeof it.id === "string" && (it.id.startsWith("mal_") || it.id.startsWith("tvm_")))) return;
  try {
    const d = await api(`/${it.k}/${it.id}`, "&append_to_response=videos,external_ids&include_video_language=en,null");
    info[it.id] = {
      title: d.title || d.name, year: (d.release_date || d.first_air_date || "").slice(0, 4),
      rating: d.vote_average ? d.vote_average.toFixed(1) : "–", overview: d.overview || "No synopsis available.",
      poster: d.poster_path, backdrop: d.backdrop_path, genres: (d.genres || []).map(g => g.name),
      runtime: d.runtime || (d.episode_run_time || [])[0] || null,
      seasons: (d.seasons || []).filter(s => s.season_number > 0), pop: d.popularity || 0,
      imdbId: d.external_ids?.imdb_id || null
    };
  } catch (e) {}
}

async function loadAll() {
  if (!HAS_KEY) { if ($("#keyBanner")) $("#keyBanner").classList.remove("hidden"); return; }
  await Promise.allSettled(items.map(loadItem));
  hot = Object.keys(info).map(Number).filter(id => item(id) && !item(id).extra).sort((a, b) => (info[b]?.pop || 0) - (info[a]?.pop || 0)).slice(0, 6);
  render(); renderHero();

  if (window.location.hash.startsWith('#watch-')) {
    const hashId = window.location.hash.replace('#watch-', '');
    if (hashId) openModal(hashId);
  }
}

async function loadSeason(n) {
  season = n; episodes = []; epIdx = 0; drawModal();
  if (!cur || (typeof cur.id === "string" && (cur.id.startsWith("mal_") || cur.id.startsWith("tvm_")))) return;
  try { episodes = (await api(`/tv/${cur.id}/season/${n}`)).episodes || []; } catch (e) {}
  drawModal();
}

/* ============ ARTWORK FALLBACK (SVG) ============ */
function art(title, id, w, h) {
  const safeTitle = String(title || "MovieBox");
  const numId = typeof id === "number" ? id : (parseInt(String(id).replace(/\D/g, "")) || 123);
  const hue = (numId * 47) % 360, words = safeTitle.split(" "), mid = Math.ceil(words.length / 2);
  const lines = words.length > 1 ? [words.slice(0, mid).join(" "), words.slice(mid).join(" ")] : words;
  const fs = w * (w > h ? 0.07 : 0.085);
  const text = lines.map((l, n) => `<tspan x='${w*0.08}' dy='${n ? fs*1.1 : 0}'>${esc(l)}</tspan>`).join("");
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${w} ${h}'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${hue},70%,40%)'/><stop offset='1' stop-color='hsl(${(hue+60)%360},60%,8%)'/></linearGradient></defs><rect width='100%' height='100%' fill='url(#g)'/><text x='${w*0.08}' y='${h*0.78}' font-family='sans-serif' font-weight='800' font-size='${fs}' fill='white'>${text}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

const posterUrl = it => {
  const d = get(it);
  if (d.posterUrl) return d.posterUrl;
  return d.poster ? IMG + "w342" + d.poster : art(d.title, it.id, 300, 450);
};

function fallback(img, id, w, h) { img.onerror = null; const it = item(id); img.src = art(it ? get(it).title : "Title", id, w, h); }

/* ============ RENDER LOGIC ============ */
function visible() {
  const q = query.trim().toLowerCase();
  return items.filter(it => {
    if (!it) return false;
    const d = get(it);
    const tabOk = tab === "all" || tab === c || (tab === "trending" && hot.includes(Number(it.id))) || (tab === "favs" && favs.some(f => String(f) === String(it.id)));
    if (it.extra && !favs.some(f => String(f) === String(it.id)) && !(q && remote.some(r => String(r) === String(it.id)))) return false;
    const searchString = `${d.title} ${(d.genres||[]).join(" ")} ${LABEL[it.c] || ""}`.toLowerCase();
    return tabOk && (!q || remote.some(r => String(r) === String(it.id)) || searchString.includes(q));
  });
}

function render() {
  const tabsNav = $("#tabs");
  if (tabsNav) {
    tabsNav.innerHTML = TABS.map(([k, n, icon]) =>
      `<button data-tab="${k}" class="shrink-0 h-10 px-4 rounded-full text-sm font-semibold inline-flex items-center justify-center gap-2 transition ${tab === k ? "bg-crimson shadow-[0_0_16px_#e50914] text-white" : "glass text-gray-300 hover:text-white"}"><i class="${icon} text-xs"></i><span>${n}</span></button>`
    ).join("");
  }

  const isAbout = tab === "about";
  if ($("#about")) $("#about").classList.toggle("hidden", !isAbout);
  if ($("#heading")) $("#heading").classList.toggle("hidden", isAbout);
  if ($("#grid")) $("#grid").classList.toggle("hidden", isAbout);

  if (isAbout) { if ($("#empty")) $("#empty").classList.add("hidden"); drawAbout(); return; }

  const list = visible();
  const currentTabName = (TABS.find(t => t[0] === tab) || ["","All"])[1];
  if ($("#heading")) $("#heading").textContent = `${currentTabName} (${list.length})`;

  if ($("#grid")) {
    $("#grid").innerHTML = list.map(it => {
      const d = get(it);
      const isFav = favs.some(f => String(f) === String(it.id));
      return `
      <button data-id="${it.id}" class="card text-left rounded-xl overflow-hidden glass">
        <div class="relative aspect-[2/3] overflow-hidden bg-white/5">
          <img src="${posterUrl(it)}" alt="${esc(d.title)}" loading="lazy" onerror="fallback(this,'${it.id}',300,450)" class="w-full h-full object-cover">

  }
}

/* ============ DYNAMIC HERO AUTO-SLIDER ============ */
let heroIndex = 0;
let heroTimer = null;

  const featured = items.slice(0, 5);
  const it = featured[heroIndex] || items[0];
  const d = get(it);

  heroSec.style.backgroundImage = `url("${d.backdrop ? IMG + "w1280" + d.backdrop : art(d.title, it.id, 1400, 700)}")`;
  heroSec.style.transition = "background-image 0.8s ease-in-out";

  heroSec.innerHTML = `
    <div class="absolute inset-0 bg-gradient-to-t from-ink via-ink/60 to-transparent"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-ink/80 to-transparent"></div>
    <div class="relative max-w-7xl mx-auto w-full px-4 pb-10 pt-20">
      <div class="flex flex-wrap gap-2 mb-3 text-xs font-bold">
        <span class="bg-crimson px-2 py-1 rounded">${LABEL[it.c] || 'Featured'}</span>
        <span class="glass px-2 py-1 rounded"><i class="fa-solid fa-star text-yellow-400"></i> TMDB ${d.rating}</span>
        ${d.year ? `<span class="glass px-2 py-1 rounded">${d.year}</span>` : ""}
        ${(d.genres||[]).slice(0, 2).map(g => `<span class="glass text-electric px-2 py-1 rounded">${esc(g)}</span>`).join("")}
      </div>
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight transition-all">${esc(d.title)}</h1>
      <p class="max-w-lg text-gray-300 my-4 line-clamp-3 text-sm sm:text-base">${esc(d.overview)}</p>
      
      <div class="flex items-center gap-4">
        <button data-id="${it.id}" class="h-11 sm:h-12 px-7 sm:px-8 rounded-full bg-crimson font-bold shadow-[0_0_24px_#e50914] hover:scale-105 transition"><i class="fa-solid fa-play mr-2"></i>Watch Now</button>
      </div>

      <!-- Slider Indicator Dots -->
      <div class="flex gap-2 mt-6">
        ${featured.map((_, i) => `
          <button onclick="changeHeroSlide(${i})" aria-label="Slide ${i+1}" class="h-2 rounded-full transition-all duration-300 ${i === heroIndex ? "w-8 bg-crimson shadow-[0_0_10px_#e50914]" : "w-2 bg-white/30 hover:bg-white/60"}"></button>
        `).join("")}
      </div>

  startHeroTimer();
}

function changeHeroSlide(idx) {
  heroIndex = idx;
  renderHero();
}

function startHeroTimer() {
  if (heroTimer) clearInterval(heroTimer);
  heroTimer = setInterval(() => {
    const total = Math.min(items.length, 5);
    if (total > 0) {
      heroIndex = (heroIndex + 1) % total;
      renderHero();
    }
  }, 5000);
}

/* ============ LANDSCAPE FULLSCREEN ============ */
async function togglePlayerFullScreen() {
  const box = document.getElementById("playerBox");
  if (!box) return;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    try {
      if (box.requestFullscreen) await box.requestFullscreen();
      else if (box.webkitRequestFullscreen) await box.webkitRequestFullscreen();
      if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {});
    } catch (err) {}
  } else {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

/* ============ AUTO-HIDE FULLSCREEN BUTTON LOGIC ============ */
let fsBtnTimeout = null;

function resetFsBtnTimer() {
  const btn = document.getElementById("playerFsBtn");
  if (!btn) return;
  btn.classList.remove("hidden-btn");
  clearTimeout(fsBtnTimeout);
  fsBtnTimeout = setTimeout(() => {
    const currentBtn = document.getElementById("playerFsBtn");
    if (currentBtn) currentBtn.classList.add("hidden-btn");
  }, 5000);
}

['touchstart', 'mousemove', 'click', 'keydown', 'scroll'].forEach(evt => {
  window.addEventListener(evt, () => {
    const modal = document.getElementById("modal");
    if (modal && !modal.classList.contains("hidden")) {
      resetFsBtnTimer();
    }

});

/* ============ EMBEDDED MODAL ============ */
function openModal(id) {
  cur = item(id); season = 1; episodes = []; epIdx = 0; currentServer = 3;
  if ($("#modal")) $("#modal").classList.remove("hidden");
  document.body.style.overflow = "hidden";

  if (cur) {
    const d = get(cur);
    const imgPath = d.posterUrl || (d.poster ? (IMG + "w500" + d.poster) : null);
    updateSEO(d.title, d.overview, imgPath);
    injectMovieSchema(d);
    window.location.hash = `watch-${cur.id}`;
  }

  drawModal();
  if (HAS_KEY && cur && cur.k === "tv") loadSeason(1);
}

function closeModal() {
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  if ($("#modal")) $("#modal").classList.add("hidden");
  if ($("#modalBody")) $("#modalBody").innerHTML = "";
  document.body.style.overflow = "";
  updateSEO();
  if (window.location.hash.startsWith("#watch-")) {
    history.pushState("", document.title, window.location.pathname + window.location.search);
  }
  render();
}

      <div><p class="font-semibold text-sm">S${season}E${ep.episode_number} · ${esc(ep.name)}${ep.runtime ? ` <span class="text-gray-400 font-normal">· ${ep.runtime}m</span>` : ""}</p>
      <p class="text-xs text-gray-300 mt-1">${esc(ep.overview || "No description available.")}</p></div></div>` : ""}
    <div class="flex flex-wrap gap-2 max-h-40 overflow-y-auto">${episodes.map((e, n) =>

  const meta = [LABEL[cur.c], d.year, d.runtime ? d.runtime + " min" : "", (d.genres||[]).join(", ")].filter(Boolean).join(" • ");

function toast(m) { const t = $("#toast"); if (!t) return; t.textContent = m; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 1700); }
async function share() {
  if (!cur) return;
  const data = {title: get(cur).title, text: `Check out ${get(cur).title} on MovieBox Hub`, url: location.href};
  try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.url); toast("Link copied"); } } catch (e) {}
}

/* ============ SEARCH ============ */
async function remoteSearch(q) {
  if (q.length < 2) { remote = []; searching = false; return render(); }
  searching = true; render();

  let tmdbFound = false;
  const fresh = []; remote = [];

  if (HAS_KEY) {
    try {
      const r = await api("/search/multi", `&include_adult=false&query=${encodeURIComponent(q)}`);
      if (q !== query.trim()) return;
      const results = (r.results || []).filter(x => (x.media_type === "movie" || x.media_type === "tv") && x.poster_path);

      if (results.length > 0) {
        tmdbFound = true;
        results.slice(0, 15).forEach(x => {
          let it = item(x.id);
          if (!it) {
            const anime = (x.genre_ids || []).includes(16) && x.original_language === "ja";
            it = {id: x.id, k: x.media_type, c: anime ? "anime" : x.media_type === "tv" ? "drama" : "movie", t: x.title || x.name, extra: true};
            items.push(it); fresh.push(it);
          }
          if (it.k === x.media_type) remote.push(it.id);
        });
        await Promise.allSettled(fresh.map(loadItem));
      }
    } catch (e) {}
  }

  if (!tmdbFound && q === query.trim()) {
    if (tab === "anime" || tab === "all") {
      try {
        const jikanRes = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=6`);
        const jikanData = await jikanRes.json();
        if (jikanData.data && jikanData.data.length > 0) {
          jikanData.data.forEach(x => {
            const customId = "mal_" + x.mal_id;
            let it = item(customId);
            if (!it) {
              it = { id: customId, k: "tv", c: "anime", t: x.title, extra: true };
              items.push(it);
            }
            info[customId] = {
              title: x.title, year: x.year || (x.aired?.from ? x.aired.from.slice(0, 4) : ""),
              rating: x.score ? x.score.toFixed(1) : "–", overview: x.synopsis || "No synopsis available.",
              posterUrl: x.images?.jpg?.large_image_url || x.images?.jpg?.image_url,
              backdrop: null, genres: (x.genres || []).map(g => g.name), runtime: x.duration ? parseInt(x.duration) : null,
              seasons: [], pop: x.members || 0
            };
            remote.push(customId);
          });
        }
      } catch (e) {}
    }

    if (remote.length === 0 && (tab === "drama" || tab === "all" || tab === "movie")) {
      try {
        const tvmRes = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
        const tvmData = await tvmRes.json();
        if (tvmData && tvmData.length > 0) {
          tvmData.slice(0, 6).forEach(entry => {
            const x = entry.show;
            const customId = "tvm_" + x.id;
            let it = item(customId);
            if (!it) {
              it = { id: customId, k: "tv", c: "drama", t: x.name, extra: true };
              items.push(it);
            }
            info[customId] = {
              title: x.name, year: x.premiered ? x.premiered.slice(0, 4) : "",
              rating: x.rating?.average ? x.rating.average.toFixed(1) : "–",
              overview: x.summary ? x.summary.replace(/<[^>]*>/g, '') : "No synopsis available.",
              posterUrl: x.image?.original || x.image?.medium, backdrop: null, genres: x.genres || [],
              runtime: x.runtime || null, seasons: [], pop: 0, imdbId: x.externals?.imdb || null
            };
            remote.push(customId);
          });
        }
      } catch (e) {}
    }
  }

  if (q === query.trim()) { searching = false; render(); }
}

/* ============ EVENTS ============ */
document.addEventListener("click", e => {
  const t = e.target, tabBtn = t.closest("[data-tab]"), card = t.closest("[data-id]"),
        epBtn = t.closest("[data-ep]"), seasonBtn = t.closest("[data-season]"),
        srvBtn = t.closest("[data-srv]"), act = t.closest("[data-act]");
  if (tabBtn) { tab = tabBtn.dataset.tab; render(); }
  else if (srvBtn) { currentServer = +srvBtn.dataset.srv; drawModal(); }
  else if (act) {
    if (act.dataset.act === "close") closeModal();
    if (act.dataset.act === "share") share();
    if (act.dataset.act === "fav" && cur) {
      const exists = favs.some(f => String(f) === String(cur.id));
      favs = exists ? favs.filter(x => String(x) !== String(cur.id)) : [...favs, cur.id];
      saveFavs(); toast(favs.some(f => String(f) === String(cur.id)) ? "Added to favorites" : "Removed from favorites"); drawModal();
    }
  }
  else if (seasonBtn) loadSeason(+seasonBtn.dataset.season);
  else if (epBtn) { epIdx = +epBtn.dataset.ep; drawModal(); }
  else if (card && !card.closest("#modal")) {
    const rawId = card.dataset.id;
    openModal(rawId);
  }
  else if (t.id === "modal") closeModal();
});

const searchInput = $("#search");
if (searchInput) {
  searchInput.addEventListener("input", e => {
    query = e.target.value; if (tab === "about") tab = "all"; if (query.trim().length < 2) remote = []; render();
    clearTimeout(timer); timer = setTimeout(() => remoteSearch(query.trim()), 350);
  });
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal") && !$("#modal").classList.contains("hidden")) closeModal(); });

/* ============ INITIALIZATION ============ */
initTheme();
renderHero();
render();
loadAll();
</script>
